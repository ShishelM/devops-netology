#cloud-config
users:
  - name: pavel
    groups: sudo, docker
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh-authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH1aldsXuAs62u6zs8rqqAzylhg6foOlY8uOqCadg4MY jonyblaze2019@gmail.com

packages:
  - git
  - curl
  - docker.io
  - docker-compose-v2

runcmd:
  - usermod -aG docker pavel
  - sleep 5
  - git clone https://github.com/ShishelM/shvirtd-example-python.git /home/pavel/shvirtd-example-python
  - chown -R pavel:pavel /home/pavel/shvirtd-example-python
  - cd /home/pavel/shvirtd-example-python && docker compose up -d --build
